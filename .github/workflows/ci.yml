name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
      - name: Install Servo
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgstreamer-plugins-bad1.0-0
          cd "$RUNNER_TEMP"
          curl --fail --location --remote-name https://github.com/servo/servo/releases/download/v0.4.0/servo-x86_64-linux-gnu.tar.gz
          curl --fail --location --remote-name https://github.com/servo/servo/releases/download/v0.4.0/servo-x86_64-linux-gnu.tar.gz.sha256
          sha256sum --check servo-x86_64-linux-gnu.tar.gz.sha256
          tar --extract --gzip --file servo-x86_64-linux-gnu.tar.gz
          echo "SERVO_SHELL_PATH=$RUNNER_TEMP/servo/servoshell" >> "$GITHUB_ENV"
      - run: pnpm run check
